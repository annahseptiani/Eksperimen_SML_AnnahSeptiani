name: Automated Data Preprocessing

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Memungkinkan Anda menjalankan workflow secara manual dari web GitHub jika dibutuhkan

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengunduh kode dari repositori GitHub Anda ke server runner
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Memasang Python versi 3.10 di server runner GitHub
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. Memasang library dependency yang dibutuhkan oleh script automate Anda
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      # 4. Menjalankan fungsi otomatisasi preprocessing secara background
      - name: Run Preprocessing Automation Script
        run: |
          python preprocessing/automate_AnnahSeptiani.py

      # 5. Mengunggah kembali dataset hasil proses (heart_preprocessed.csv) ke repositori Anda
      - name: Commit and Push Preprocessed Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add preprocessing/heart_preprocessed.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Dataset hasil preprocessing terbaru via GitHub Actions" && git push)
